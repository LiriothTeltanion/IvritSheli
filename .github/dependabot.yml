version: 2

# Agrupado a proposito: las subidas menores y de parche llegan en un solo PR
# por ecosistema y semana. Las de version mayor siguen llegando sueltas,
# porque son las unicas que pueden romper algo y merecen revisarse una a una.

updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jerusalem
    labels: [dependencies, backend]
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:10"
      timezone: Asia/Jerusalem
    labels: [dependencies, frontend]
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:20"
      timezone: Asia/Jerusalem
    labels: [dependencies, docker]
    open-pull-requests-limit: 3
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Asia/Jerusalem
    labels: [dependencies, ci]
    open-pull-requests-limit: 3
    groups:
      actions-all:
        patterns: ["*"]
