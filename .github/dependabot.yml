version: 2

# Grouped on purpose: minor and patch bumps arrive in a single PR per
# ecosystem. Major bumps still arrive one by one, because they are the only
# ones that can break something and deserve a review each.
#
# Monthly, not weekly, since 2026-09-14: each weekly batch brought up to eight
# PRs with their own CI run and notification even when no code had changed.
# Security alerts do not follow this schedule; they arrive as soon as they appear.
#
# cooldown: a freshly published version waits before it is proposed. Broken
# releases are usually yanked or patched in that window; majors wait a month.
#
# Minor, patch and image-digest updates merge on their own once the checks pass
# (.github/workflows/dependabot-auto-merge.yml). Majors and any maintainer change
# wait for Kevin. Merging the Dockerfile does not touch production: the Render
# deployment is manual (autoDeployTrigger: off).

updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Jerusalem
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    labels: [dependencies, backend]
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
      time: "06:10"
      timezone: Asia/Jerusalem
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    labels: [dependencies, frontend]
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      time: "06:20"
      timezone: Asia/Jerusalem
    cooldown:
      default-days: 3
      semver-major-days: 30
    labels: [dependencies, docker]
    open-pull-requests-limit: 3
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:30"
      timezone: Asia/Jerusalem
    cooldown:
      default-days: 7
    labels: [dependencies, ci]
    open-pull-requests-limit: 3
    groups:
      actions-all:
        patterns: ["*"]
