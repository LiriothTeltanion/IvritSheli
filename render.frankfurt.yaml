services:
  - type: web
    name: ivrit-sheli
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: AUTH_REQUIRED
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TRUSTED_PROXY_MODE
        value: render
      - key: AI_PROVIDER
        value: offline
      - key: ALLOW_CLOUD_PROCESSING
        value: "false"
      - key: SELF_HOSTED_SPEECH_ENABLED
        value: "false"
      - key: WHISPER_PRELOAD_ON_START
        value: "false"
      - key: PUSH_NOTIFICATIONS_ENABLED
        value: "false"
      - key: DICTA_NAKDAN_URL
        value: ""
      - key: GOOGLE_ACCESS_TOKEN
        value: ""
      - key: GOOGLE_REFRESH_TOKEN
        value: ""
      # These three were copied with `fromService` from ivrit-sheli-staging when the
      # service was created, so nobody had to type a secret. They are already set and
      # verified in production: the database keeps progress and Google sign-in works,
      # checked on 2026-09-13.
      #
      # That is exactly why they move to `sync: false`. While they pointed at the old
      # service, deleting it would have broken the next Blueprint sync. With
      # `sync: false` Render stops managing them and keeps the value they already
      # have, so the source can disappear without consequences.
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_AUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_AUTH_CLIENT_SECRET
        sync: false
      # This one is NOT copied: it must differ, it is the new service's URL.
      - key: PUBLIC_BASE_URL
        sync: false
      # Its own new secret. Sessions are not inherited anyway, because the cookie
      # domain changes with the URL.
      - key: SESSION_SECRET
        generateValue: true
