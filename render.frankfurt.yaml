services:
  - type: web
    name: ivrit-sheli
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: AUTH_REQUIRED
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TRUSTED_PROXY_MODE
        value: render
      - key: AI_PROVIDER
        value: offline
      - key: ALLOW_CLOUD_PROCESSING
        value: "false"
      - key: SELF_HOSTED_SPEECH_ENABLED
        value: "false"
      - key: WHISPER_PRELOAD_ON_START
        value: "false"
      - key: PUSH_NOTIFICATIONS_ENABLED
        value: "false"
      - key: DICTA_NAKDAN_URL
        value: ""
      - key: GOOGLE_ACCESS_TOKEN
        value: ""
      - key: GOOGLE_REFRESH_TOKEN
        value: ""
      # Los tres secretos se copian del servicio que ya funciona. Nadie los
      # teclea ni los lee: Render resuelve el valor al sincronizar el plano.
      # Antes de borrar ivrit-sheli-staging hay que pasarlos a `sync: false`,
      # o la siguiente sincronizacion fallara al no encontrar el origen.
      - key: DATABASE_URL
        fromService:
          type: web
          name: ivrit-sheli-staging
          envVarKey: DATABASE_URL
      - key: GOOGLE_AUTH_CLIENT_ID
        fromService:
          type: web
          name: ivrit-sheli-staging
          envVarKey: GOOGLE_AUTH_CLIENT_ID
      - key: GOOGLE_AUTH_CLIENT_SECRET
        fromService:
          type: web
          name: ivrit-sheli-staging
          envVarKey: GOOGLE_AUTH_CLIENT_SECRET
      # Este NO se copia: tiene que ser distinto, es la URL del servicio nuevo.
      - key: PUBLIC_BASE_URL
        sync: false
      # Secreto propio y nuevo. Las sesiones no se heredan de todos modos,
      # porque el dominio de la cookie cambia con la URL.
      - key: SESSION_SECRET
        generateValue: true
