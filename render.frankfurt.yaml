services:
  - type: web
    name: ivrit-sheli
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: AUTH_REQUIRED
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TRUSTED_PROXY_MODE
        value: render
      - key: AI_PROVIDER
        value: offline
      - key: ALLOW_CLOUD_PROCESSING
        value: "false"
      - key: SELF_HOSTED_SPEECH_ENABLED
        value: "false"
      - key: WHISPER_PRELOAD_ON_START
        value: "false"
      - key: PUSH_NOTIFICATIONS_ENABLED
        value: "false"
      - key: DICTA_NAKDAN_URL
        value: ""
      - key: GOOGLE_ACCESS_TOKEN
        value: ""
      - key: GOOGLE_REFRESH_TOKEN
        value: ""
      # Estos tres se copiaron con `fromService` desde ivrit-sheli-staging al
      # crear el servicio, para que nadie tuviera que teclear un secreto. Ya
      # estan puestos y verificados en produccion: la base guarda progreso y el
      # acceso con Google funciona, comprobado el 13 sep 2026.
      #
      # Pasan a `sync: false` justo por eso. Mientras apuntaran al servicio
      # viejo, borrarlo habria roto la siguiente sincronizacion del plano. Con
      # `sync: false` Render deja de gestionarlos y conserva el valor que ya
      # tienen, asi que el origen puede desaparecer sin consecuencias.
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_AUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_AUTH_CLIENT_SECRET
        sync: false
      # Este NO se copia: tiene que ser distinto, es la URL del servicio nuevo.
      - key: PUBLIC_BASE_URL
        sync: false
      # Secreto propio y nuevo. Las sesiones no se heredan de todos modos,
      # porque el dominio de la cookie cambia con la URL.
      - key: SESSION_SECRET
        generateValue: true
