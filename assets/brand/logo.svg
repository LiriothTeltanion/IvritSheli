<svg width="720" height="196" viewBox="0 0 720 196" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ivrit Sheli</title>
  <desc id="desc">Ivrit Sheli learning mark with a Hebrew aleph on a warm card and the Hebrew word שלי as a coral handwritten accent.</desc>
  <defs>
    <linearGradient id="card" x1="26" y1="22" x2="174" y2="174" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9EC"/>
      <stop offset="1" stop-color="#F4E4C4"/>
    </linearGradient>
    <linearGradient id="ink" x1="40" y1="32" x2="159" y2="164" gradientUnits="userSpaceOnUse">
      <stop stop-color="#245D68"/>
      <stop offset="1" stop-color="#12394B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#071723" flood-opacity=".18"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="20" y="18" width="160" height="160" rx="46" fill="url(#card)" stroke="#E3C289" stroke-width="2"/>
  </g>
  <circle cx="144" cy="52" r="17" fill="#E8AC3A"/>
  <path d="M144 27v-8M144 85v-8M119 52h-8M177 52h-8" stroke="#E8AC3A" stroke-width="5" stroke-linecap="round"/>
  <text x="100" y="133" text-anchor="middle" font-size="94" font-family="Arial, 'Noto Sans Hebrew', sans-serif" font-weight="700" fill="url(#ink)">א</text>
  <path d="M62 150c26-9 48-2 72-11 12-5 23-12 31-21" stroke="#C93448" stroke-width="7" stroke-linecap="round"/>
  <circle cx="51" cy="49" r="5" fill="#2D7D74"/><circle cx="68" cy="49" r="5" fill="#E8AC3A"/><circle cx="85" cy="49" r="5" fill="#C93448"/>

  <g transform="translate(216 0)">
    <text x="0" y="104" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="70" font-weight="800" letter-spacing="-4" fill="#172033">Ivrit</text>
    <g transform="translate(184 0) rotate(-3 75 96)">
      <text x="0" y="106" font-family="'Segoe Print', 'Guttman Yad-Brush', 'Arial Hebrew', Arial, sans-serif" font-size="73" font-weight="600" fill="#C93448">שלי</text>
      <path d="M9 124c40-10 80 3 133-10" stroke="#C93448" stroke-width="6" stroke-linecap="round" opacity=".7"/>
    </g>
    <text x="3" y="147" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="650" letter-spacing="1.6" fill="#5B6978">LIVING HEBREW · ENGLISH · ESPAÑOL · עברית</text>
  </g>
</svg>
