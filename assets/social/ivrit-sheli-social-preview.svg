  <text x="64" y="352" fill="#f4f8ff" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600">Hebrew for the life you actually live.</text>
  <text x="64" y="404" fill="#b4c2d6" font-family="Arial,Helvetica,sans-serif" font-size="24">240 semantic scenes · listening and speech · private by default</text>

  <g font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">
    <rect x="64" y="452" width="176" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="152" y="481" fill="#a5f3fc" text-anchor="middle">EN · ES · עברית</text>
    <rect x="256" y="452" width="212" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#5eead4" stroke-opacity="0.32"/>
    <text x="362" y="481" fill="#5eead4" text-anchor="middle">Works offline</text>
    <rect x="484" y="452" width="228" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#f5cb73" stroke-opacity="0.30"/>
    <text x="598" y="481" fill="#f5cb73" text-anchor="middle">No tracking</text>
  </g>

  <text x="64" y="576" fill="#75879f" font-family="Arial,Helvetica,sans-serif" font-size="18">ivrit-sheli · aprende hebreo · לומדים עברית</text>
</svg>
