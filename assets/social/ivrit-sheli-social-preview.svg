<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">Ivrit Sheli — Hebrew for real life</title>
  <desc id="d">The Ivrit Sheli wordmark on a nocturnal navy field, with the tagline "Hebrew for real life" in English, Spanish and Hebrew.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05101a"/><stop offset="55%" stop-color="#091e32"/><stop offset="100%" stop-color="#0b2b45"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="28%" r="58%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.20"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="64" y1="120" x2="470" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="58%" stop-color="#a5f3fc"/><stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="rule" x1="64" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9"/><stop offset="65%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Wordmark. Drawn as paths, never <text>: this file is exported to a raster
       and consumed as an image, where no font-family can resolve. -->
  <g transform="translate(55.53 113.41) scale(1.4118)">
    <path d="M266.5 16 L265 7 L269.5 16 Z" fill="#f5cb73"/>
    <path d="M276.5 16 L278 7 L279.5 16 Z" fill="#f5cb73"/>
    <path d="M286.5 16 L291 7 L289.5 16 Z" fill="#f5cb73"/>
    <path d="M6 16 H40 L44 21 V33 H29 V74 H39 V84 H14 L11 80 V74 H21 V33 H14 V43 H6 Z" fill="url(#ink)" fill-rule="evenodd"/>
    <path d="M56 16 H76 L80 21 V33 H56 Z M92 16 H112 L116 21 V33 H92 Z M58 33 H67 L86 75.1 L105 33 H114 L91 84 H81 Z" fill="url(#ink)" fill-rule="evenodd"/>
    <path d="M128 16 H168 L172 21 V60 L188 84 H176 L160 60 H136 V84 H131 L128 80 Z M136 33 H164 V50 H136 Z" fill="url(#ink)" fill-rule="evenodd"/>
    <path d="M200 16 H234 L238 21 V33 H223 V74 H233 V84 H208 L205 80 V74 H215 V33 H208 V43 H200 Z" fill="url(#ink)" fill-rule="evenodd"/>
    <path d="M250 16 H302 L306 21 V33 H282 V74 H292 V84 H267 L264 80 V74 H274 V33 H258 V43 H250 Z" fill="url(#ink)" fill-rule="evenodd"/>
  </g>
  <rect x="64" y="244" width="424" height="7" rx="3.5" fill="url(#rule)"/>
  <text x="516" y="228" fill="#ff3b5c" font-family="'Times New Roman',serif" font-size="104" font-weight="700" text-anchor="start">שלי</text>

  <text x="64" y="352" fill="#f4f8ff" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600">Hebrew for the life you actually live.</text>
  <text x="64" y="404" fill="#b4c2d6" font-family="Arial,Helvetica,sans-serif" font-size="24">240 hand-drawn scenes · listening and speech · private by default</text>

  <g font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">
    <rect x="64" y="452" width="176" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="152" y="481" fill="#a5f3fc" text-anchor="middle">EN · ES · עברית</text>
    <rect x="256" y="452" width="212" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#5eead4" stroke-opacity="0.32"/>
    <text x="362" y="481" fill="#5eead4" text-anchor="middle">Works offline</text>
    <rect x="484" y="452" width="228" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#f5cb73" stroke-opacity="0.30"/>
    <text x="598" y="481" fill="#f5cb73" text-anchor="middle">No tracking</text>
  </g>

  <text x="64" y="576" fill="#75879f" font-family="Arial,Helvetica,sans-serif" font-size="18">ivrit-sheli · aprende hebreo · לומדים עברית</text>
</svg>
