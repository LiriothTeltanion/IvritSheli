    <path d="M266.5 16 L265 7 L269.5 16 Z" fill="#f5cb73"/>
    <path d="M276.5 16 L278 7 L279.5 16 Z" fill="#f5cb73"/>
    <path d="M286.5 16 L291 7 L289.5 16 Z" fill="#f5cb73"/>
    <path d="M6 16 H40 L44 21 V33 H29 V74 H39 V84 H14 L11 80 V74 H21 V33 H14 V43 H6 Z" fill="url(#ink)" fill-rule="evenodd"/>
    <path d="M56 16 H76 L80 21 V33 H56 Z M92 16 H112 L116 21 V33 H92 Z M58 33 H67 L86 75.1 L105 33 H114 L91 84 H81 Z" fill="url(#ink)" fill-rule="evenodd"/>
    <path d="M128 16 H168 L172 21 V60 L188 84 H176 L160 60 H136 V84 H131 L128 80 Z M136 33 H164 V50 H136 Z" fill="url(#ink)" fill-rule="evenodd"/>
    <path d="M200 16 H234 L238 21 V33 H223 V74 H233 V84 H208 L205 80 V74 H215 V33 H208 V43 H200 Z" fill="url(#ink)" fill-rule="evenodd"/>
    <path d="M250 16 H302 L306 21 V33 H282 V74 H292 V84 H267 L264 80 V74 H274 V33 H258 V43 H250 Z" fill="url(#ink)" fill-rule="evenodd"/>
  </g>
  <rect x="64" y="244" width="424" height="7" rx="3.5" fill="url(#rule)"/>

