<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">Ivrit Sheli — Hebrew for real life</title>
  <desc id="d">The Ivrit Sheli Nocturne wordmark and the message "Hebrew for the life you actually live" on a navy field, with trilingual, offline and no-tracking highlights.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05101a"/><stop offset="55%" stop-color="#091e32"/><stop offset="100%" stop-color="#0b2b45"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="28%" r="58%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.20"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="64" y1="120" x2="470" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="58%" stop-color="#a5f3fc"/><stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="rule" x1="64" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9"/><stop offset="65%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="coral" x1="510" y1="88" x2="686" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff0a54"/><stop offset="50%" stop-color="#ff477e"/><stop offset="100%" stop-color="#ff7096"/>
    </linearGradient>
    <linearGradient id="coralRule" x1="514" y1="0" x2="685" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff758c"/><stop offset="50%" stop-color="#ff3b5c"/><stop offset="100%" stop-color="#ff1744"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Wordmark. Both halves use the exact path contours shipped by the app and
       README lockup. Supporting card copy remains text, then the deterministic
       Chromium exporter flattens the complete SVG into the public PNG. -->
