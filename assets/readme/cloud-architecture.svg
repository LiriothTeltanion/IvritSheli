<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Ivrit Sheli 2.2 production architecture</title>
  <desc id="desc">An animated accessible diagram connecting the trilingual React interface through secure authentication and FastAPI to PostgreSQL, the Hebrew dictionary, tests and structured logs.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07111f"/>
      <stop offset="0.5" stop-color="#0c1830"/>
      <stop offset="1" stop-color="#10152e"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#40e4dc"/>
      <stop offset="1" stop-color="#6685ff"/>
    </linearGradient>
    <linearGradient id="blueViolet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5c83ff"/>
      <stop offset="1" stop-color="#b95cff"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#7892c7" stroke-opacity=".07"/>
    </pattern>
    <style>
      .label{font:700 20px Inter,Arial,sans-serif;fill:#edf5ff}
      .sub{font:500 14px Inter,Arial,sans-serif;fill:#9fb0d1}
      .tiny{font:700 12px Inter,Arial,sans-serif;fill:#7deae5;letter-spacing:.08em}
      .route{fill:none;stroke:#607eff;stroke-width:3;stroke-linecap:round;stroke-dasharray:8 10;animation:route 3s linear infinite}
      .route.cyan{stroke:#45dcd5;animation-delay:-1.2s}
      .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .packet{animation:packet 3s ease-in-out infinite;filter:url(#softGlow)}
      .packet.second{animation-delay:-1.5s}
      @keyframes route{to{stroke-dashoffset:-36}}
      @keyframes pulse{0%,100%{opacity:.72;transform:scale(.96)}50%{opacity:1;transform:scale(1.03)}}
      @keyframes packet{0%,100%{opacity:.15}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.route,.pulse,.packet{animation:none}.route{stroke-dasharray:none}.packet{opacity:.8}}
    </style>
  </defs>

  <rect width="1200" height="500" rx="30" fill="url(#background)"/>
  <rect width="1200" height="500" rx="30" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1197" height="497" rx="28.5" fill="none" stroke="#6783c7" stroke-opacity=".28" stroke-width="3"/>

  <text x="58" y="58" class="tiny">IVRIT SHELI 2.2 · TWO MODES, ONE LEARNING ENGINE</text>
  <text x="58" y="91" class="label" font-size="28">Private locally. Authenticated in the cloud.</text>

  <path class="route cyan" d="M292 250H419"/>
  <path class="route" d="M697 220H827"/>
  <path class="route cyan" d="M697 280H827"/>
  <circle class="packet" cx="354" cy="250" r="5" fill="#c7fffb"/>
  <circle class="packet second" cx="762" cy="220" r="5" fill="#d9dfff"/>
  <circle class="packet" cx="762" cy="280" r="5" fill="#c7fffb"/>

  <g class="pulse">
    <rect x="58" y="150" width="234" height="200" rx="24" fill="#101e3b" stroke="#45dcd5" stroke-opacity=".75" stroke-width="2"/>
    <rect x="80" y="174" width="190" height="44" rx="12" fill="#152a4b"/>
    <circle cx="102" cy="196" r="8" fill="#45dcd5"/>
    <circle cx="126" cy="196" r="8" fill="#6685ff"/>
    <circle cx="150" cy="196" r="8" fill="#b95cff"/>
    <text x="82" y="263" class="label">React + TypeScript</text>
    <text x="82" y="292" class="sub">English · Español · עברית</text>
    <text x="82" y="319" class="sub">PWA · RTL · reduced motion</text>
  </g>

  <g>
    <rect x="419" y="126" width="278" height="248" rx="28" fill="#111b3a" stroke="url(#blueViolet)" stroke-width="3" filter="url(#softGlow)"/>
    <path d="M558 158 595 173v31c0 30-16 54-37 65-21-11-37-35-37-65v-31Z" fill="url(#cyanBlue)" opacity=".2" stroke="#72e2d7" stroke-width="2"/>
    <path d="m541 207 12 12 25-31" fill="none" stroke="#e9ffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="558" y="305" class="label" text-anchor="middle">FastAPI security boundary</text>
    <text x="558" y="332" class="sub" text-anchor="middle">OAuth + PKCE · secure sessions · CSRF</text>
    <text x="558" y="355" class="sub" text-anchor="middle">request IDs · authorization · version</text>
  </g>

  <g class="pulse">
    <rect x="827" y="126" width="315" height="112" rx="22" fill="#151c3c" stroke="#7c8fff" stroke-width="2"/>
    <ellipse cx="872" cy="158" rx="25" ry="10" fill="#5c83ff"/>
    <path d="M847 158v40c0 6 11 11 25 11s25-5 25-11v-40" fill="#5c83ff" opacity=".28" stroke="#92a3ff"/>
    <ellipse cx="872" cy="198" rx="25" ry="10" fill="#5c83ff" opacity=".5"/>
    <text x="918" y="168" class="label">PostgreSQL 17</text>
    <text x="918" y="195" class="sub">Users · sessions · JSONB state</text>
    <text x="918" y="219" class="sub">Alembic · RLS tenant isolation</text>
  </g>

  <g>
    <rect x="827" y="262" width="315" height="112" rx="22" fill="#10283a" stroke="#46d9d1" stroke-width="2"/>
    <path d="M852 292h46v54h-46z" fill="#45dcd5" opacity=".18" stroke="#72e2d7"/>
    <path d="M860 305h30M860 317h30M860 329h22" stroke="#c9fffb" stroke-width="3" stroke-linecap="round"/>
    <text x="918" y="304" class="label">SQLite lexicon</text>
    <text x="918" y="331" class="sub">Fast Hebrew FTS reference data</text>
    <text x="918" y="355" class="sub">Local-first engine preserved</text>
  </g>

  <g>
    <rect x="58" y="410" width="1084" height="48" rx="16" fill="#101a33" stroke="#5e739d" stroke-opacity=".45"/>
    <circle cx="85" cy="434" r="8" fill="#52dd9b"/>
    <text x="104" y="439" class="sub">Real PostgreSQL integration tests</text>
    <circle cx="365" cy="434" r="8" fill="#7c8fff"/>
    <text x="384" y="439" class="sub">Non-root Docker image</text>
    <circle cx="615" cy="434" r="8" fill="#45dcd5"/>
    <text x="634" y="439" class="sub">Structured redacted JSON logs</text>
    <circle cx="929" cy="434" r="8" fill="#b977ff"/>
    <text x="948" y="439" class="sub">Live + ready probes</text>
  </g>
</svg>
