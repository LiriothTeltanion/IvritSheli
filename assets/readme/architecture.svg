<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;display=swap');
      .bg { fill: #0b1121; rx: 12px; }
      .text { font-family: 'Inter', sans-serif; fill: #e2e8f0; font-size: 16px; font-weight: 600; }
      .title { font-size: 20px; font-weight: 800; fill: #38bdf8; }
      .node { fill: #1e293b; stroke: #334155; stroke-width: 2; rx: 8px; }
      .node-text { fill: #38bdf8; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; }
      
      .line { stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 6; animation: dash 2s linear infinite; opacity: 0.7; }
      @keyframes dash {
        to { stroke-dashoffset: -12; }
      }
      .pulse { animation: pulse 2s infinite; }
      @keyframes pulse {
        0% { filter: drop-shadow(0 0 2px #38bdf8); }
        50% { filter: drop-shadow(0 0 10px #38bdf8); }
        100% { filter: drop-shadow(0 0 2px #38bdf8); }
      }
    </style>
  </defs>

  <rect class="bg" width="800" height="250" />
  <text x="400" y="40" class="title" text-anchor="middle">Tech Stack &amp; Architecture</text>

  <!-- Lines -->
  <line x1="200" y1="120" x2="400" y2="120" class="line" />
  <line x1="400" y1="120" x2="600" y2="120" class="line" />
  <line x1="400" y1="120" x2="400" y2="180" class="line" />

  <!-- Node: Frontend -->
  <g transform="translate(100, 95)" class="pulse">
    <rect class="node" width="140" height="50" />
    <text x="70" y="30" class="node-text" text-anchor="middle">React 19 + Vite</text>
  </g>

  <!-- Node: Backend -->
  <g transform="translate(330, 95)" class="pulse" style="animation-delay: 0.5s;">
    <rect class="node" width="140" height="50" />
    <text x="70" y="30" class="node-text" text-anchor="middle">FastAPI (Python)</text>
  </g>

  <!-- Node: DB -->
  <g transform="translate(560, 95)" class="pulse" style="animation-delay: 1s;">
    <rect class="node" width="140" height="50" />
    <text x="70" y="30" class="node-text" text-anchor="middle">PostgreSQL 17</text>
  </g>

  <!-- Node: Infra -->
  <g transform="translate(330, 175)" class="pulse" style="animation-delay: 1.5s;">
    <rect class="node" width="140" height="50" />
    <text x="70" y="30" class="node-text" text-anchor="middle">Render &amp; Supabase</text>
  </g>

</svg>
