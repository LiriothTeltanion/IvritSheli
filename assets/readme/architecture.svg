<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;family=Inter:wght@400;600;800&amp;display=swap');

      .bg { fill: #071220; rx: 16px; }

      .grid-line { stroke: #1e293b; stroke-width: 1.5; stroke-dasharray: 4 6; }

      .title { font-family: 'Inter', sans-serif; font-size: 26px; font-weight: 800; fill: #ffffff; letter-spacing: 1px; }
      .subtitle { font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 500; fill: #22d3ee; letter-spacing: 2px; }

      .tier-box { fill: rgba(16, 23, 42, 0.6); stroke-width: 1.5; rx: 16px; }
      .tier-client { stroke: #22d3ee; }
      .tier-api { stroke: #c084fc; }
      .tier-db { stroke: #38bdf8; }

      .tier-title { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 800; letter-spacing: 2px; fill: #94a3b8; }
      .tier-subtitle { font-family: 'Fira Code', monospace; font-size: 10px; fill: #64748b; }

      .card { fill: rgba(15, 23, 42, 0.8); rx: 12px; stroke-width: 1; }
      .card-client { stroke: rgba(34, 211, 238, 0.3); }
      .card-api { stroke: rgba(192, 132, 252, 0.3); }
      .card-db { stroke: rgba(56, 189, 248, 0.3); }

      .card-title { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 800; fill: #f8fafc; }
      .bullet { font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 500; }
      .b-client { fill: #67e8f9; }
      .b-api { fill: #d8b4fe; }
      .b-db { fill: #7dd3fc; }

      .text-item { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; fill: #cbd5e1; }

      .path-bg { stroke: #1e293b; stroke-width: 3; fill: none; }

      .path-flow-1 { stroke: #22d3ee; stroke-width: 3; fill: none; stroke-dasharray: 8 12; animation: flow-fwd 20s linear infinite; filter: url(#glow-cyan); }
      .path-flow-2 { stroke: #c084fc; stroke-width: 3; fill: none; stroke-dasharray: 8 12; animation: flow-rev 20s linear infinite reverse; filter: url(#glow-purple); }
      .path-flow-3 { stroke: #38bdf8; stroke-width: 3; fill: none; stroke-dasharray: 8 12; animation: flow-fwd 20s linear infinite; filter: url(#glow-blue); }
      .path-flow-4 { stroke: #f472b6; stroke-width: 3; fill: none; stroke-dasharray: 8 12; animation: flow-rev 20s linear infinite reverse; filter: url(#glow-pink); }

      @keyframes flow-fwd { to { stroke-dashoffset: -400; } }
      @keyframes flow-rev { to { stroke-dashoffset: -400; } }

      .pulse-node { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="grad-client" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="grad-api" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="grad-db" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.0" />
    </linearGradient>

  </defs>

  <!-- Background -->
  <rect class="bg" width="1000" height="450" />

  <!-- Subtle Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" class="grid-line" />
  </pattern>
  <rect width="1000" height="450" fill="url(#grid)" opacity="0.3" rx="16" />

  <!-- Header -->
  <g transform="translate(500, 60)">
    <text class="title" text-anchor="middle" filter="url(#glow-blue)">SYSTEMS ARCHITECTURE &amp; DATA FLOW</text>
    <text y="28" class="subtitle" text-anchor="middle">v2.12.3 // LOCAL-FIRST PWA &amp; IMMUTABLE STATE</text>
  </g>

  <!-- Flow Lines (Drawn behind the tiers) -->
  <!-- Client <-> API -->
  <path d="M 290 230 L 390 230" class="path-bg" />
  <path d="M 290 230 L 390 230" class="path-flow-1" />

  <path d="M 390 270 L 290 270" class="path-bg" />
  <path d="M 390 270 L 290 270" class="path-flow-2" />

  <!-- API <-> DB -->
  <path d="M 610 230 L 710 230" class="path-bg" />
  <path d="M 610 230 L 710 230" class="path-flow-3" />

  <path d="M 710 270 L 610 270" class="path-bg" />
  <path d="M 710 270 L 610 270" class="path-flow-4" />

  <!-- TIER 1: CLIENT -->
  <g transform="translate(40, 130)">
    <rect width="250" height="280" class="tier-box tier-client" fill="url(#grad-client)" />
    <text x="125" y="30" class="tier-title" text-anchor="middle" fill="#22d3ee">CLIENT TIER</text>
    <text x="125" y="46" class="tier-subtitle" text-anchor="middle">(BROWSER / PWA)</text>

    <rect x="20" y="65" width="210" height="195" class="card card-client" />
    <text x="125" y="95" class="card-title" text-anchor="middle">React 19 + Vite</text>

    <g transform="translate(35, 125)">
      <text y="0"><tspan class="bullet b-client">✦</tspan><tspan class="text-item" dx="10">Service Worker</tspan></text>
      <text y="25"><tspan class="bullet b-client">✦</tspan><tspan class="text-item" dx="10">Dexie (IndexedDB)</tspan></text>
      <text y="50"><tspan class="bullet b-client">✦</tspan><tspan class="text-item" dx="10">Local-first State</tspan></text>
      <text y="75"><tspan class="bullet b-client">✦</tspan><tspan class="text-item" dx="10">PWA Manifest</tspan></text>
      <text y="100"><tspan class="bullet b-client">✦</tspan><tspan class="text-item" dx="10">Zod Validation</tspan></text>
      <text y="125"><tspan class="bullet b-client">✦</tspan><tspan class="text-item" dx="10">Framer Motion</tspan></text>
    </g>
  </g>

  <!-- TIER 2: API -->
  <g transform="translate(375, 130)">
    <rect width="250" height="280" class="tier-box tier-api" fill="url(#grad-api)" />
    <text x="125" y="30" class="tier-title" text-anchor="middle" fill="#c084fc">COMPUTE TIER</text>
    <text x="125" y="46" class="tier-subtitle" text-anchor="middle">(STATELESS API)</text>

    <rect x="20" y="65" width="210" height="195" class="card card-api" />
    <text x="125" y="95" class="card-title" text-anchor="middle">FastAPI Engine</text>

    <g transform="translate(35, 125)">
      <text y="0"><tspan class="bullet b-api">⚡</tspan><tspan class="text-item" dx="10">Uvicorn ASGI</tspan></text>
      <text y="25"><tspan class="bullet b-api">⚡</tspan><tspan class="text-item" dx="10">Pydantic Models</tspan></text>
      <text y="50"><tspan class="bullet b-api">⚡</tspan><tspan class="text-item" dx="10">Dependency Inj.</tspan></text>
      <text y="75"><tspan class="bullet b-api">⚡</tspan><tspan class="text-item" dx="10">JWT Auth Guards</tspan></text>
      <text y="100"><tspan class="bullet b-api">⚡</tspan><tspan class="text-item" dx="10">OpenAPI / Redoc</tspan></text>
      <text y="125"><tspan class="bullet b-api">⚡</tspan><tspan class="text-item" dx="10">SQLModel</tspan></text>
    </g>
  </g>

  <!-- TIER 3: DB -->
  <g transform="translate(710, 130)">
    <rect width="250" height="280" class="tier-box tier-db" fill="url(#grad-db)" />
    <text x="125" y="30" class="tier-title" text-anchor="middle" fill="#38bdf8">PERSISTENCE TIER</text>
    <text x="125" y="46" class="tier-subtitle" text-anchor="middle">(RELATIONAL DB)</text>

    <rect x="20" y="65" width="210" height="195" class="card card-db" />
    <text x="125" y="95" class="card-title" text-anchor="middle">PostgreSQL 17</text>

    <g transform="translate(35, 125)">
      <text y="0"><tspan class="bullet b-db">❖</tspan><tspan class="text-item" dx="10">Row Level Sec.</tspan></text>
      <text y="25"><tspan class="bullet b-db">❖</tspan><tspan class="text-item" dx="10">pgvector</tspan></text>
      <text y="50"><tspan class="bullet b-db">❖</tspan><tspan class="text-item" dx="10">UUIDv7 PKs</tspan></text>
      <text y="75"><tspan class="bullet b-db">❖</tspan><tspan class="text-item" dx="10">JSONB Analytics</tspan></text>
      <text y="100"><tspan class="bullet b-db">❖</tspan><tspan class="text-item" dx="10">Alembic Migrat.</tspan></text>
      <text y="125"><tspan class="bullet b-db">❖</tspan><tspan class="text-item" dx="10">Connection Pool</tspan></text>
    </g>
  </g>

  <!-- Connection Nodes / Pulses -->
  <circle cx="290" cy="230" r="5" fill="#22d3ee" filter="url(#glow-cyan)" />
  <circle cx="390" cy="230" r="5" fill="#22d3ee" />

  <circle cx="390" cy="270" r="5" fill="#c084fc" filter="url(#glow-purple)" />
  <circle cx="290" cy="270" r="5" fill="#c084fc" />

  <circle cx="610" cy="230" r="5" fill="#38bdf8" filter="url(#glow-blue)" />
  <circle cx="710" cy="230" r="5" fill="#38bdf8" />

  <circle cx="710" cy="270" r="5" fill="#f472b6" filter="url(#glow-pink)" />
  <circle cx="610" cy="270" r="5" fill="#f472b6" />

</svg>
