<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&amp;family=Inter:wght@400;600;800&amp;display=swap');
      .bg { fill: #09090b; rx: 16px; }
      .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4 4; }
      .title { font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 800; fill: #fbcfe8; }
      .subtitle { font-family: 'Fira Code', monospace; font-size: 12px; fill: #ec4899; }

      .node-core { fill: #111827; stroke: #db2777; stroke-width: 2; rx: 50px; }
      .node-lang { fill: #111827; stroke: #9d174d; stroke-width: 2; rx: 12px; }

      .core-text { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 800; fill: #fbcfe8; }
      .lang-title { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 800; fill: #f472b6; }
      .lang-meta { font-family: 'Fira Code', monospace; font-size: 11px; fill: #fbcfe8; }

      .flow-line { stroke: #be185d; stroke-width: 2; fill: none; stroke-dasharray: 8; animation: flow-dash 3s linear infinite; }
      @keyframes flow-dash { to { stroke-dashoffset: -24; } }

      .bounce { animation: bounce 4s infinite ease-in-out; }
      @keyframes bounce {
        0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 2px #db2777); }
        50% { transform: translateY(-8px); filter: drop-shadow(0 0 12px #db2777); }
      }
    </style>
  </defs>

  <rect class="bg" width="900" height="240" />
  <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" class="grid" />
  </pattern>
  <rect width="900" height="240" fill="url(#grid2)" opacity="0.5" />

  <text x="450" y="40" class="title" text-anchor="middle">Trilingual Native Core &amp; RTL Engine</text>
  <text x="450" y="60" class="subtitle" text-anchor="middle">i18next // bidi // Semantic Keys</text>

  <!-- Connection Lines -->
  <path d="M 230 160 C 300 160, 350 120, 400 120" class="flow-line" />
  <path d="M 670 160 C 600 160, 550 120, 500 120" class="flow-line" />
  <path d="M 450 150 L 450 120" class="flow-line" />

  <!-- Core -->
  <g transform="translate(400, 95)">
    <rect class="node-core" width="100" height="50" />
    <text x="50" y="31" class="core-text" text-anchor="middle">i18n.ts</text>
  </g>

  <!-- EN -->
  <g transform="translate(100, 130)">
    <g class="bounce" style="animation-delay: 0s;">
      <rect class="node-lang" width="150" height="80" />
      <text x="75" y="30" class="lang-title" text-anchor="middle">English</text>
      <text x="75" y="50" class="lang-meta" text-anchor="middle">dir: ltr</text>
      <text x="75" y="65" class="lang-meta" text-anchor="middle">locale: en-US</text>
    </g>
  </g>

  <!-- ES -->
  <g transform="translate(375, 130)">
    <g class="bounce" style="animation-delay: 1.3s;">
      <rect class="node-lang" width="150" height="80" />
      <text x="75" y="30" class="lang-title" text-anchor="middle">Español</text>
      <text x="75" y="50" class="lang-meta" text-anchor="middle">dir: ltr</text>
      <text x="75" y="65" class="lang-meta" text-anchor="middle">locale: es-ES</text>
    </g>
  </g>

  <!-- HE -->
  <g transform="translate(650, 130)">
    <g class="bounce" style="animation-delay: 2.6s;">
      <rect class="node-lang" width="150" height="80" />
      <text x="75" y="30" class="lang-title" text-anchor="middle">עברית</text>
      <text x="75" y="50" class="lang-meta" text-anchor="middle">dir: rtl</text>
      <text x="75" y="65" class="lang-meta" text-anchor="middle">locale: he-IL</text>
    </g>
  </g>

</svg>
