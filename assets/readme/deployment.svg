<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;display=swap');
      .title { font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 800; fill: #46e3b7; }
      .text-sm { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; fill: #94a3b8; }
      .text-md { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 800; fill: #e2e8f0; }
      
      .path-line { stroke: #334155; stroke-width: 3; fill: none; }
      .glow-line { 
        stroke: #46e3b7; 
        stroke-width: 3; 
        fill: none; 
        stroke-dasharray: 10, 15; 
        animation: flow 1.5s linear infinite; 
      }
      .glow-line-blue { 
        stroke: #38bdf8; 
        stroke-width: 3; 
        fill: none; 
        stroke-dasharray: 10, 15; 
        animation: flow 1.5s linear infinite reverse; 
      }
      @keyframes flow {
        from { stroke-dashoffset: 25; }
        to { stroke-dashoffset: 0; }
      }
      .node-box { fill: #0f172a; stroke: #1e293b; stroke-width: 2; rx: 12; }
      .node-glow-green { animation: pulseG 3s infinite; }
      .node-glow-blue { animation: pulseB 3s infinite; animation-delay: 1.5s; }
      
      @keyframes pulseG {
        0%, 100% { filter: drop-shadow(0 0 5px rgba(70, 227, 183, 0.4)); stroke: #46e3b7; }
        50% { filter: drop-shadow(0 0 15px rgba(70, 227, 183, 0.8)); stroke: #2dd4bf; }
      }
      @keyframes pulseB {
        0%, 100% { filter: drop-shadow(0 0 5px rgba(56, 189, 248, 0.4)); stroke: #38bdf8; }
        50% { filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.8)); stroke: #0ea5e9; }
      }
      .icon-fill { fill: #94a3b8; }
      .circle-pulse { fill: #46e3b7; animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
      @keyframes ping {
        75%, 100% { transform: scale(2); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0b1121" rx="16" />
  
  <text x="400" y="35" class="title" text-anchor="middle">Live Cloud Infrastructure</text>

  <!-- Connection Paths -->
  <!-- User to Render -->
  <path d="M 150 125 C 200 125, 230 125, 280 125" class="path-line" />
  <path d="M 150 125 C 200 125, 230 125, 280 125" class="glow-line" />
  
  <!-- Render to Supabase -->
  <path d="M 460 125 C 510 125, 540 125, 590 125" class="path-line" />
  <path d="M 460 125 C 510 125, 540 125, 590 125" class="glow-line-blue" />

  <!-- Node 1: Client/User -->
  <g transform="translate(50, 85)">
    <rect width="100" height="80" class="node-box" />
    <circle cx="50" cy="35" r="15" class="icon-fill" />
    <path d="M 30 65 C 30 50, 70 50, 70 65" class="icon-fill" />
    <text x="50" y="95" class="text-sm" text-anchor="middle">Global Users</text>
    <!-- Status Ping -->
    <circle cx="90" cy="10" r="4" fill="#46e3b7" />
    <circle cx="90" cy="10" r="4" class="circle-pulse" transform-origin="90 10" />
  </g>

  <!-- Node 2: Render App -->
  <g transform="translate(280, 75)" class="node-glow-green">
    <rect width="180" height="100" class="node-box" />
    <text x="90" y="45" class="text-md" text-anchor="middle">Render Staging</text>
    <text x="90" y="65" class="text-sm" text-anchor="middle" fill="#46e3b7">ivrit-sheli-staging</text>
    <text x="90" y="85" class="text-sm" text-anchor="middle">FastAPI + React 19</text>
  </g>

  <!-- Node 3: Supabase DB -->
  <g transform="translate(590, 75)" class="node-glow-blue">
    <rect width="170" height="100" class="node-box" />
    <path d="M 85 25 C 115 25, 135 30, 135 35 C 135 40, 115 45, 85 45 C 55 45, 35 40, 35 35 C 35 30, 55 25, 85 25 Z" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M 35 35 L 35 65 C 35 70, 55 75, 85 75 C 115 75, 135 70, 135 65 L 135 35" fill="none" stroke="#38bdf8" stroke-width="2" />
    <text x="85" y="95" class="text-md" text-anchor="middle">Supabase Pooler</text>
    <text x="85" y="115" class="text-sm" text-anchor="middle" fill="#38bdf8">PostgreSQL 17 (IPv4)</text>
  </g>

</svg>
