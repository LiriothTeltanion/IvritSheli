<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <!-- No webfont CDN: this app's CSP is style-src 'self' and
         font-src 'self' data:, so a Google Fonts link can never resolve here.
         Brand letterforms are drawn as SVG paths; Hebrew uses the local
         /fonts/ face with system fallbacks. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030912" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="A dark-first adult editorial Hebrew-learning journey in English, Spanish, and Hebrew." />
    <meta name="application-name" content="Ivrit Sheli" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ivrit Sheli" />
    <script>
      (() => {
        let theme = 'dark';
        try {
          const params = new URLSearchParams(window.location.search);
          const previewTheme = params.get('theme');
          if (params.get('visualQa') === '1') {
            theme = previewTheme === 'light' || previewTheme === 'dark' ? previewTheme : 'dark';
          } else {
            const savedTheme = window.localStorage.getItem('ivrit-sheli-theme');
            if (savedTheme === 'light' || savedTheme === 'dark') theme = savedTheme;
          }
        } catch {
          // The dark product default remains available without persistent storage.
        }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#030912' : '#f7f1e5');
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icons/app-icon.svg?v=2.12.2" />
    <link rel="apple-touch-icon" href="/icons/app-icon-192.png?v=2.12.2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Ivrit Sheli 2.12.2 · Visual Harmony & Resilience · העברית שלי</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
