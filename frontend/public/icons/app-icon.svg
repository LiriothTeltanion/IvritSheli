<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Ivrit Sheli App Icon</title>
  <desc id="description">Professional premium icon for Ivrit Sheli with Tel Aviv background and sleek typography.</desc>
  <defs>
    <clipPath id="squircle_clip">
      <rect width="512" height="512" rx="115" />
    </clipPath>
    <linearGradient id="overlay_gradient" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020c1b" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#010710" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#000205" stop-opacity="0.60"/>
    </linearGradient>
    <linearGradient id="border_gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64ffda"/>
      <stop offset="50%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#03045e"/>
    </linearGradient>
    <linearGradient id="text_gradient" x1="120" y1="180" x2="390" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="accent_gradient" x1="160" y1="300" x2="360" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff0a54"/>
      <stop offset="50%" stop-color="#ff477e"/>
      <stop offset="100%" stop-color="#ff7096"/>
    </linearGradient>
    <linearGradient id="cyan_bar_grad" x1="130" y1="280" x2="380" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="60%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="coral_bar_grad" x1="140" y1="410" x2="370" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff758c"/>
      <stop offset="50%" stop-color="#ff3b5c"/>
      <stop offset="100%" stop-color="#ff1744"/>
    </linearGradient>
    <linearGradient id="wordmark_ink_grad" x1="84" y1="178" x2="380" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="center_glow" cx="256" cy="256" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#00b4d8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#squircle_clip)">
    <!-- Base Image Background -->
    <image href="data:image/jpeg;base64," x="0" y="0" width="512" height="512" preserveAspectRatio="xMidYMid slice" opacity="1.0" />
    
    <!-- Navy Blue Darkening Gradient Overlay -->
    <rect width="512" height="512" fill="url(#overlay_gradient)"/>
    
    <!-- Deep Blue Glow behind text -->
    <circle cx="256" cy="256" r="220" fill="url(#center_glow)"/>
  </g>

  <!-- Border -->
  <rect x="8" y="8" width="496" height="496" rx="107" stroke="url(#border_gradient)" stroke-width="8" opacity="0.9"/>
  <rect x="24" y="24" width="464" height="464" rx="95" stroke="#ffffff" stroke-width="2" opacity="0.1"/>
  
  <path d="M 0,256 C 256,150 256,362 512,256" stroke="url(#border_gradient)" stroke-width="2" opacity="0.25" fill="none" />
  
  <g>
    <!-- IVRIT: Hebraized letterforms drawn as paths. Never use <text> here — an
         SVG rendered as an app icon or through <img> cannot load a webfont, so
         any font-family silently falls back and the brand changes shape. -->
    <g transform="translate(77.06 159.65) scale(1.1471)" opacity="0.35">
      <path d="M6 16 H40 L44 21 V33 H29 V74 H39 V84 H14 L11 80 V74 H21 V33 H14 V43 H6 Z" fill="#64ffda" fill-rule="evenodd"/>
      <path d="M56 16 H76 L80 21 V33 H56 Z M92 16 H112 L116 21 V33 H92 Z M58 33 H67 L86 75.1 L105 33 H114 L91 84 H81 Z" fill="#64ffda" fill-rule="evenodd"/>
      <path d="M128 16 H168 L172 21 V60 L188 84 H176 L160 60 H136 V84 H131 L128 80 Z M136 33 H164 V50 H136 Z" fill="#64ffda" fill-rule="evenodd"/>
      <path d="M200 16 H234 L238 21 V33 H223 V74 H233 V84 H208 L205 80 V74 H215 V33 H208 V43 H200 Z" fill="#64ffda" fill-rule="evenodd"/>
      <path d="M250 16 H302 L306 21 V33 H282 V74 H292 V84 H267 L264 80 V74 H274 V33 H258 V43 H250 Z" fill="#64ffda" fill-rule="evenodd"/>
    </g>
    <g transform="translate(77.06 157.65) scale(1.1471)">
      <path d="M266.5 16 L265 7 L269.5 16 Z" fill="#f5cb73"/>
      <path d="M276.5 16 L278 7 L279.5 16 Z" fill="#f5cb73"/>
      <path d="M286.5 16 L291 7 L289.5 16 Z" fill="#f5cb73"/>
      <path d="M6 16 H40 L44 21 V33 H29 V74 H39 V84 H14 L11 80 V74 H21 V33 H14 V43 H6 Z" fill="url(#wordmark_ink_grad)" fill-rule="evenodd"/>
      <path d="M56 16 H76 L80 21 V33 H56 Z M92 16 H112 L116 21 V33 H92 Z M58 33 H67 L86 75.1 L105 33 H114 L91 84 H81 Z" fill="url(#wordmark_ink_grad)" fill-rule="evenodd"/>
      <path d="M128 16 H168 L172 21 V60 L188 84 H176 L160 60 H136 V84 H131 L128 80 Z M136 33 H164 V50 H136 Z" fill="url(#wordmark_ink_grad)" fill-rule="evenodd"/>
      <path d="M200 16 H234 L238 21 V33 H223 V74 H233 V84 H208 L205 80 V74 H215 V33 H208 V43 H200 Z" fill="url(#wordmark_ink_grad)" fill-rule="evenodd"/>
      <path d="M250 16 H302 L306 21 V33 H282 V74 H292 V84 H267 L264 80 V74 H274 V33 H258 V43 H250 Z" fill="url(#wordmark_ink_grad)" fill-rule="evenodd"/>
    </g>

    <!-- Calligraphic Cyan Stroke -->
    <path d="M 90 282 C 180 260, 320 255, 430 280 C 330 295, 200 295, 90 282 Z" fill="url(#cyan_bar_grad)"/>
    <!-- Highlight on stroke -->
    <path d="M 100 280 C 190 265, 310 262, 410 280 C 320 288, 210 288, 100 280 Z" fill="#ffffff" opacity="0.4"/>
  </g>

  <g>
    <!-- Sheli Typography -->
    <text x="256" y="372" text-anchor="middle" font-family="'Gveret Levin', 'Caveat', cursive" font-size="105" font-weight="900" letter-spacing="4" fill="#ff0a54" opacity="0.5">שלי</text>
    <text x="256" y="370" text-anchor="middle" font-family="'Gveret Levin', 'Caveat', cursive" font-size="105" font-weight="900" letter-spacing="4" fill="url(#accent_gradient)">שלי</text>
    
    <!-- Calligraphic Red Signature Stroke (Organic Tapering Brush) -->
    <path d="M 140 405 C 220 380, 270 385, 370 395 C 400 398, 380 402, 350 402 C 280 402, 200 410, 140 405 Z" fill="url(#coral_bar_grad)"/>
    <!-- Highlight on stroke -->
    <path d="M 142 404 C 220 384, 270 387, 360 396 C 370 397, 360 399, 340 399 C 270 399, 200 406, 142 404 Z" fill="#ffffff" opacity="0.35"/>
  </g>
</svg>
