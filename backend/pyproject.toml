[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ivrit-sheli-ultimate"
version = "2.4.0"
description = "Private, adaptive, trilingual Hebrew-learning operating system"
readme = {text = "Ivrit Sheli 2.4 Contest Edition backend: local-first SQLite plus Google/GitHub authenticated PostgreSQL cloud mode.", content-type = "text/markdown"}
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kevin Lirioth Cusnir"}]
dependencies = [
  "fastapi==0.140.0",
  "uvicorn[standard]==0.51.0",
  "pydantic==2.13.4",
  "requests==2.34.2",
  "python-multipart==0.0.32",
  "psycopg[binary]==3.3.4",
  "SQLAlchemy==2.0.51",
  "alembic==1.18.5",
]

[project.scripts]
ivrit-sheli = "ivrit_sheli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "postgres: requires explicit MIGRATION_DATABASE_URL and DATABASE_URL PostgreSQL instances",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
exclude = ["tests/"]
