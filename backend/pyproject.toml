[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ivrit-sheli-ultimate"
version = "1.0.0"
description = "Private, adaptive, trilingual Hebrew-learning operating system"
readme = "../README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kevin Lirioth Cusnir"}]
dependencies = [
  "fastapi==0.139.0",
  "uvicorn[standard]==0.51.0",
  "pydantic==2.13.4",
  "requests==2.34.2",
  "python-multipart==0.0.32",
]

[project.scripts]
ivrit-sheli = "ivrit_sheli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
exclude = ["tests/"]
