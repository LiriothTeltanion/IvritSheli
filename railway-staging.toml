[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ["/app/scripts/docker-entrypoint.sh python -m ivrit_sheli.db_admin migrate"]
startCommand = "/app/scripts/docker-entrypoint.sh serve"
healthcheckPath = "/health/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
overlapSeconds = 0
drainingSeconds = 15

# This file is intentionally separate from railway.toml. Select it only on the
# private v2.9 staging web service; the verified public v2.4 service stays
# attached to railway.toml until the pilot and explicit release approval pass.
